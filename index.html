<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="A small collection of apps and digital products made by AGB Studio."
    >
    <title>AGB Studio — Apps</title>
    <link rel="stylesheet" href="site.css">
  </head>
  <body id="top">
    <header class="site-header">
      <a class="brand" href="#top" aria-label="AGB Studio, back to top">
        AGB Studio
      </a>
      <a class="contact-link" href="https://www.miraku.jp/contact">
        Contact
      </a>
    </header>

    <main class="apps-main">
      <section class="intro" aria-label="AGB Studio">
        <span class="eyebrow">made with love</span>
      </section>

      <section class="json-viewer" aria-label="AGB Studio apps JSON">
        <header class="json-toolbar">
          <div class="json-file">
            <span class="json-file-dot" aria-hidden="true"></span>
            <span>apps.json</span>
            <span id="json-meta" class="json-meta">Loading…</span>
          </div>
          <button
            id="copy-json"
            class="copy-button"
            type="button"
            disabled
          >
            Copy JSON
          </button>
        </header>
        <pre class="json-document"><code
          id="apps-json"
          aria-live="polite"
        ></code></pre>
      </section>
    </main>
    <script src="apps.js" defer></script>
  </body>
</html>
